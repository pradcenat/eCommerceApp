name: Deploy ProductService

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ProductService/ProductService.Api/ProductService.Api.csproj

      - name: Build ProductService
        run: dotnet build ProductService/ProductService.Api/ProductService.Api.csproj --configuration Release --no-restore

      - name: Publish ProductService
        run: dotnet publish ProductService/ProductService.Api/ProductService.Api.csproj --configuration Release --output ./publish --no-build

      - name: Login to Azure and Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ecommerce-product-api-prad
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
